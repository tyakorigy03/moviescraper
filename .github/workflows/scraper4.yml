name: Scrape 4 (rebamovie)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode: 'delta' (default), 'full' re-resolve, or 'repair' to re-resolve downloads on existing rebamovie rows"
        type: choice
        options:
          - delta
          - full
          - repair
        default: delta
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scrape-rebamovie:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scrape4-${{ github.ref }}
      cancel-in-progress: true
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      REBA_LANGUAGE_CODE: "rn"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run rebamovie delta
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'delta') }}
        run: npm run scrape4

      - name: Run rebamovie full
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' }}
        run: npm run scrape4 -- --full

      - name: Run rebamovie repair
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'repair' }}
        run: npm run scrape4 -- --repair

      - name: Commit storage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/*.json logs/*.json 2>/dev/null || true
          git commit -m "chore: update rebamovie scrape state [skip ci]" || echo "No changes to commit"
          git push