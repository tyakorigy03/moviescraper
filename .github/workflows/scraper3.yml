name: Scrape 3 — agasobanuyenow (weekly)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta (cheap) or full (re-scrape everything)'
        required: true
        default: 'delta'
      slug:
        description: 'optional single title slug — usages --slug --deep'
        required: false
        default: ''
  schedule:
    - cron: "0 3 * * 1"

jobs:
  scrape3:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scrape3-${{ github.ref }}
      cancel-in-progress: true
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      AGNOW_INSERT_NEW: "true"
      AGNOW_DELAY_MS: "350"
      # NOTE: NOT insert-only. This scraper intentionally upgrades the
      # Downloadurls of matched rows. Safety comes from the merge logic
      # (never touches/overwrites "(Server HD)", never deletes rows).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper 3
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node scrapers/agasobanuyenow/index.js --slug "${{ inputs.slug }}" --deep
          elif [ "${{ inputs.mode }}" = "full" ]; then
            node scrapers/agasobanuyenow/index.js --full
          else
            node scrapers/agasobanuyenow/index.js
          fi

      - name: Commit storage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/*.json logs/*.json 2>/dev/null || true
          git commit -m "chore: update agasobanuyenow state [skip ci]" || echo "No changes to commit"
          git push