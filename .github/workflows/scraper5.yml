name: Hotsignals (scrape5)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  scrape-hotsignals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scrape5
      cancel-in-progress: true
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      REBA_LANGUAGE_CODE: "rn"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run hotsignals (hot-boost scoring)
        run: npm run scrape5

      - name: Commit storage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/*.json logs/*.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git commit -m "chore: update hotsignals snapshot [skip ci]" 2>/dev/null || echo "No changes to commit"
            git pull --rebase origin main 2>/dev/null || true
            git push && exit 0
            sleep $((i * 5))
          done
          exit 1