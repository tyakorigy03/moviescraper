name: Scrape (scheduled)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode: 'welcome' (default) or 'all' for a full recrawl"
        type: choice
        options:
          - welcome
          - all
        default: welcome
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scrape-${{ github.ref }}
      cancel-in-progress: true
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Only insert new `link`s; don't touch existing rows.
      SUPABASE_INSERT_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        if: ${{ github.event_name == 'schedule' }}
        run: npm run scrape

      - name: Run full recrawl
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all' }}
        run: node scrapers/agasobanuyelive/index.js all patch

      - name: Run welcome scrape
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'welcome' }}
        run: node scrapers/agasobanuyelive/index.js welcome patch

      - name: Commit storage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/*.json logs/*.json 2>/dev/null || true
          # Keep pushing even if the sibling scrape4 workflow bumped main at the
          # same moment: rebase local state commit on top, then retry.
          for i in 1 2 3 4 5; do
            git commit -m "chore: update scrape state [skip ci]" 2>/dev/null || echo "No changes to commit"
            git pull --rebase origin main 2>/dev/null || true
            git push && exit 0
            sleep $((i * 5))
          done
          exit 1
